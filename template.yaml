AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sce-serverless - Security Chaos Engineering em ambiente serverless (artigo UFSC).
  A (produtor) -> invoke assincrono -> B (consumidor) -> S3.

Parameters:
  AlertEmail:
    Type: String
    Description: E-mail que recebe os alertas (SNS e Budget)
  ConcorrenciaReservadaB:
    Type: Number
    Default: 0
    Description: Concorrencia reservada de B (0 = nao configura; exige cota de conta > 10)
  MaxRetriesB:
    Type: Number
    Default: 2
    AllowedValues: [0, 1, 2]
    Description: MaximumRetryAttempts da invocacao assincrona de B
  LimiteInvocacoesBMin:
    Type: Number
    Default: 450
    Description: Alarme de custo - invocacoes de B por minuto (1,5x a rajada de 5 req/s = 300/min)
  LimiteErroAPct:
    Type: Number
    Default: 5
    Description: Alarme (condicao de parada do FIS) - taxa de erro de A em %
  FisLayerArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /aws/service/fis/lambda-extension/AWS-FIS-extension-arm64/1.x.x
    Description: ARN oficial da extensao do AWS FIS para Lambda (arm64), via parametro publico SSM

Conditions:
  TemConcorrenciaReservada: !Not [!Equals [!Ref ConcorrenciaReservadaB, '0']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 128
    Timeout: 5
    Tags:
      projeto: sce-artigo

Resources:
  # ---------------------------------------------------------------- dados
  DadosBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: [{ Key: projeto, Value: sce-artigo }]

  # Bucket "sensivel" fora do escopo de B (alvo da sondagem no E1)
  SensivelBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: [{ Key: projeto, Value: sce-artigo }]

  # Bucket de configuracao da extensao do FIS (FIS escreve, extensao le)
  FisConfigBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags: [{ Key: projeto, Value: sce-artigo }]

  # ---------------------------------------------------------------- logs (retencao 1 dia)
  ProdutorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sce-produtor
      RetentionInDays: 1
      Tags: [{ Key: projeto, Value: sce-artigo }]

  ConsumidorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sce-consumidor
      RetentionInDays: 1
      Tags: [{ Key: projeto, Value: sce-artigo }]

  # ---------------------------------------------------------------- IAM (privilegio minimo)
  ProdutorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sce-produtor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: base
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${ProdutorLogGroup.Arn}'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:sce-consumidor'
      Tags: [{ Key: projeto, Value: sce-artigo }]

  ConsumidorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sce-consumidor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: base
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${ConsumidorLogGroup.Arn}'
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${DadosBucket.Arn}/dados/*'
        # Exigido pela extensao do FIS (doc: use-lambda-actions) - leitura so do prefixo FisConfigs/
        - PolicyName: fis-extensao-leitura
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FisConfigBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: ['FisConfigs/*']
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${FisConfigBucket.Arn}/FisConfigs/*'
      Tags: [{ Key: projeto, Value: sce-artigo }]

  # ---------------------------------------------------------------- funcoes
  ProdutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sce-produtor
      CodeUri: src/produtor/
      Handler: index.handler
      Role: !GetAtt ProdutorRole.Arn
      LoggingConfig:
        LogGroup: !Ref ProdutorLogGroup
      Environment:
        Variables:
          CONSUMIDOR_FUNCTION: !Ref ConsumidorFunction

  ConsumidorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sce-consumidor
      CodeUri: src/consumidor/
      Handler: index.handler
      Role: !GetAtt ConsumidorRole.Arn
      ReservedConcurrentExecutions: !If [TemConcorrenciaReservada, !Ref ConcorrenciaReservadaB, !Ref AWS::NoValue]
      LoggingConfig:
        LogGroup: !Ref ConsumidorLogGroup
      Layers:
        - !Ref FisLayerArn
      EventInvokeConfig:
        MaximumRetryAttempts: !Ref MaxRetriesB
        MaximumEventAgeInSeconds: 600
      Environment:
        Variables:
          DADOS_BUCKET: !Ref DadosBucket
          # Extensao do FIS (doc: use-lambda-actions)
          AWS_LAMBDA_EXEC_WRAPPER: /opt/aws-fis/bootstrap
          AWS_FIS_CONFIGURATION_LOCATION: !Sub '${FisConfigBucket.Arn}/FisConfigs/'
          AWS_FIS_SLOW_POLL_INTERVAL_SECONDS: '20'  # minimo aceito pela extensao (>= hot-poll de 20 s)
          AWS_FIS_LOG_LEVEL: WARN

  # ---------------------------------------------------------------- alertas
  AlertasTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: sce-alertas
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
      Tags: [{ Key: projeto, Value: sce-artigo }]

  AlertasTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertasTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DonoDaConta
            Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: [sns:Publish, sns:Subscribe, sns:GetTopicAttributes, sns:SetTopicAttributes]
            Resource: !Ref AlertasTopic
          - Sid: CloudWatchAlarmes
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertasTopic
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
          - Sid: EventBridgeDeteccao
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlertasTopic
            Condition:
              ArnEquals: { aws:SourceArn: !GetAtt DeteccaoIamRule.Arn }

  # ---------------------------------------------------------------- metricas e alarmes
  RejeicaoMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ConsumidorLogGroup
      FilterPattern: '{ $.evento = "payload_rejeitado" }'
      MetricTransformations:
        - MetricNamespace: SCE
          MetricName: PayloadRejeitado
          MetricValue: '1'
          # 0 a cada log nao casado: sem isso a metrica e esparsa e o alarme fica preso em ALARM
          DefaultValue: 0
          Unit: Count

  GravadoMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ConsumidorLogGroup
      FilterPattern: '{ $.evento = "pedido_gravado" }'
      MetricTransformations:
        - MetricNamespace: SCE
          MetricName: PedidoGravado
          MetricValue: '1'
          # 0 a cada log nao casado: sem isso a metrica e esparsa e o alarme fica preso em ALARM
          DefaultValue: 0
          Unit: Count

  RejeicaoAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sce-rejeicao-payload
      AlarmDescription: B rejeitou payload(s) - possivel adulteracao (E2)
      Namespace: SCE
      MetricName: PayloadRejeitado
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]
      Tags: [{ Key: projeto, Value: sce-artigo }]

  InvocacoesBAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sce-invocacoes-b-alto
      AlarmDescription: Invocacoes de B acima do limite por minuto - sinal antecipado de custo (E3)
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{ Name: FunctionName, Value: sce-consumidor }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: !Ref LimiteInvocacoesBMin
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]
      Tags: [{ Key: projeto, Value: sce-artigo }]

  # Condicao de parada dos experimentos FIS
  ErroAAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sce-erro-a-alto
      AlarmDescription: Taxa de erro de A acima do limite - condicao de parada do FIS
      EvaluationPeriods: 1
      Threshold: !Ref LimiteErroAPct
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]
      Metrics:
        - Id: erros
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: sce-produtor }]
            Period: 60
            Stat: Sum
        - Id: invs
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions: [{ Name: FunctionName, Value: sce-produtor }]
            Period: 60
            Stat: Sum
        # Throttles nao entram em Invocations nem em Errors, mas sao indisponibilidade de A
        - Id: thr
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions: [{ Name: FunctionName, Value: sce-produtor }]
            Period: 60
            Stat: Sum
        - Id: taxa
          Label: TaxaFalhaA
          Expression: 'IF((invs + thr) > 0, 100 * (erros + thr) / (invs + thr), 0)'
          ReturnData: true
      Tags: [{ Key: projeto, Value: sce-artigo }]

  # Amplificacao por retries: invocacoes de B / invocacoes de A (estado estavel = 1,0)
  AmplificacaoBAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sce-amplificacao-b
      AlarmDescription: Invocacoes de B mais de 1,5x as de A - retries multiplicando custo (E3)
      EvaluationPeriods: 1
      Threshold: 1.5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]
      Metrics:
        - Id: invb
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions: [{ Name: FunctionName, Value: sce-consumidor }]
            Period: 60
            Stat: Sum
        - Id: inva
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions: [{ Name: FunctionName, Value: sce-produtor }]
            Period: 60
            Stat: Sum
        - Id: razao
          Label: AmplificacaoB
          Expression: 'IF(inva > 0, invb / inva, 0)'
          ReturnData: true
      Tags: [{ Key: projeto, Value: sce-artigo }]

  # ---------------------------------------------------------------- deteccao de IAM (E1)
  TrilhaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expira-1-dia
            Status: Enabled
            ExpirationInDays: 1
      Tags: [{ Key: projeto, Value: sce-artigo }]

  TrilhaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrilhaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrilhaBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/sce-trilha'
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${TrilhaBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/sce-trilha'

  Trilha:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrilhaBucketPolicy
    Properties:
      TrailName: sce-trilha
      S3BucketName: !Ref TrilhaBucket
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
          # Unico data event: objetos do bucket sensivel (evidencia de acesso indevido no E1)
          DataResources:
            - Type: AWS::S3::Object
              Values: [!Sub '${SensivelBucket.Arn}/']
      Tags: [{ Key: projeto, Value: sce-artigo }]

  # EventBridge exige nome de log group de destino iniciado em /aws/events/
  DeteccoesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/events/sce/deteccoes
      RetentionInDays: 1
      Tags: [{ Key: projeto, Value: sce-artigo }]

  DeteccoesLogsResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: sce-eventbridge-para-deteccoes
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": { "Service": ["events.amazonaws.com", "delivery.logs.amazonaws.com"] },
            "Action": ["logs:CreateLogStream", "logs:PutLogEvents"],
            "Resource": "${DeteccoesLogGroup.Arn}"
          }]
        }

  DeteccaoIamRule:
    Type: AWS::Events::Rule
    Properties:
      Name: sce-deteccao-iam-consumidor
      Description: Mudanca de politica no papel de B (E1)
      State: ENABLED
      EventPattern:
        source: [aws.iam]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [iam.amazonaws.com]
          eventName: [AttachRolePolicy, PutRolePolicy, DetachRolePolicy, DeleteRolePolicy]
          requestParameters:
            roleName: [!Ref ConsumidorRole]
      Targets:
        - Id: sns
          Arn: !Ref AlertasTopic
        - Id: logs
          Arn: !GetAtt DeteccoesLogGroup.Arn

  # ---------------------------------------------------------------- orcamento
  Orcamento:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: sce-artigo-5usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 5, Unit: USD }
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

  # ================================================================ E1 - permissao excessiva
  E1Document:
    Type: AWS::SSM::Document
    Properties:
      Name: sce-e1-permissao-excessiva
      DocumentType: Automation
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ssm/e1-permissao-excessiva.yaml
      Tags: [{ Key: projeto, Value: sce-artigo }]

  # Papel assumido pela automacao do E1: so mexe em politica inline do papel de B e invoca B
  E1AutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sce-e1-automacao-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ssm.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: e1-minimo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [iam:PutRolePolicy, iam:DeleteRolePolicy, iam:GetRolePolicy]
                Resource: !GetAtt ConsumidorRole.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ConsumidorFunction.Arn
      Tags: [{ Key: projeto, Value: sce-artigo }]

  # Papel do FIS para os experimentos orquestrados via SSM Automation (E1 e E2)
  FisSsmRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sce-fis-ssm-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: fis.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: fis-ssm-minimo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # StartAutomationExecution e avaliado contra document/, automation-definition/
              # e automation-execution/ (confirmado nos AccessDenied do CloudTrail)
              - Effect: Allow
                Action: ssm:StartAutomationExecution
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/sce-*'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/sce-*'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*'
              - Effect: Allow
                Action: [ssm:GetAutomationExecution, ssm:StopAutomationExecution]
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/sce-e*-automacao-role'
                Condition:
                  StringEquals: { iam:PassedToService: ssm.amazonaws.com }
      Tags: [{ Key: projeto, Value: sce-artigo }]

  E1ExperimentTemplate:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: SCE E1 - permissao excessiva no papel de B (SSM Automation)
      RoleArn: !GetAtt FisSsmRole.Arn
      StopConditions:
        - Source: aws:cloudwatch:alarm
          Value: !GetAtt ErroAAlarm.Arn
      Targets: {}
      Actions:
        injetarPermissaoExcessiva:
          ActionId: aws:ssm:start-automation-execution
          Parameters:
            documentArn: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${E1Document}'
            documentParameters: !Sub >-
              {"AutomationAssumeRole":"${E1AutomationRole.Arn}","BucketSensivel":"${SensivelBucket}","JanelaExposicao":"PT1M"}
            maxDuration: PT5M
      Tags:
        projeto: sce-artigo
        experimento: E1

  # ================================================================ E3 - Denial of Wallet
  # Permissoes exigidas pelas acoes aws:lambda:* (doc: fis-actions-reference / use-lambda-actions)
  FisLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sce-fis-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: fis.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: fis-lambda-minimo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${FisConfigBucket.Arn}/FisConfigs/*'
              - Effect: Allow
                Action: lambda:GetFunction
                Resource: !GetAtt ConsumidorFunction.Arn
              - Effect: Allow
                Action: tag:GetResources
                Resource: '*'
      Tags: [{ Key: projeto, Value: sce-artigo }]

  E3Erro50Template:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: SCE E3 - B falha em 50% das invocacoes por 3 min
      RoleArn: !GetAtt FisLambdaRole.Arn
      StopConditions:
        - { Source: aws:cloudwatch:alarm, Value: !GetAtt ErroAAlarm.Arn }
      Targets:
        consumidor:
          ResourceType: aws:lambda:function
          ResourceArns: [!GetAtt ConsumidorFunction.Arn]
          SelectionMode: ALL
      Actions:
        erroB:
          ActionId: aws:lambda:invocation-error
          Parameters: { duration: PT3M, invocationPercentage: '50', preventExecution: 'true' }
          Targets: { Functions: consumidor }
      Tags: { projeto: sce-artigo, experimento: E3-erro-50 }

  E3Erro100Template:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: SCE E3 - B falha em 100% das invocacoes por 3 min
      RoleArn: !GetAtt FisLambdaRole.Arn
      StopConditions:
        - { Source: aws:cloudwatch:alarm, Value: !GetAtt ErroAAlarm.Arn }
      Targets:
        consumidor:
          ResourceType: aws:lambda:function
          ResourceArns: [!GetAtt ConsumidorFunction.Arn]
          SelectionMode: ALL
      Actions:
        erroB:
          ActionId: aws:lambda:invocation-error
          Parameters: { duration: PT3M, invocationPercentage: '100', preventExecution: 'true' }
          Targets: { Functions: consumidor }
      Tags: { projeto: sce-artigo, experimento: E3-erro-100 }

  # Atraso de 6 s > timeout de 5 s: cada invocacao vira timeout cobrado por 5 s e gera retry
  E3AtrasoTemplate:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: SCE E3 - atraso de 6 s (acima do timeout) em 100% das invocacoes de B por 3 min
      RoleArn: !GetAtt FisLambdaRole.Arn
      StopConditions:
        - { Source: aws:cloudwatch:alarm, Value: !GetAtt ErroAAlarm.Arn }
      Targets:
        consumidor:
          ResourceType: aws:lambda:function
          ResourceArns: [!GetAtt ConsumidorFunction.Arn]
          SelectionMode: ALL
      Actions:
        atrasoB:
          ActionId: aws:lambda:invocation-add-delay
          Parameters: { duration: PT3M, invocationPercentage: '100', startupDelayMilliseconds: '6000' }
          Targets: { Functions: consumidor }
      Tags: { projeto: sce-artigo, experimento: E3-atraso }

  # ================================================================ E2 - payload adulterado
  E2Document:
    Type: AWS::SSM::Document
    Properties:
      Name: sce-e2-payload-adulterado
      DocumentType: Automation
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ssm/e2-payload-adulterado.yaml
      Tags: [{ Key: projeto, Value: sce-artigo }]

  E2AutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sce-e2-automacao-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ssm.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: e2-minimo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ConsumidorFunction.Arn
      Tags: [{ Key: projeto, Value: sce-artigo }]

  E2ExperimentTemplate:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: SCE E2 - payloads adulterados enviados a B (SSM Automation)
      RoleArn: !GetAtt FisSsmRole.Arn
      StopConditions:
        - { Source: aws:cloudwatch:alarm, Value: !GetAtt ErroAAlarm.Arn }
      Targets: {}
      Actions:
        injetarPayloadAdulterado:
          ActionId: aws:ssm:start-automation-execution
          Parameters:
            documentArn: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${E2Document}'
            documentParameters: !Sub '{"AutomationAssumeRole":"${E2AutomationRole.Arn}","PorTipo":"10"}'
            maxDuration: PT5M
      Tags: { projeto: sce-artigo, experimento: E2 }

Outputs:
  DadosBucket:
    Value: !Ref DadosBucket
  SensivelBucket:
    Value: !Ref SensivelBucket
  FisConfigBucket:
    Value: !Ref FisConfigBucket
  TrilhaBucket:
    Value: !Ref TrilhaBucket
  ProdutorFunction:
    Value: !Ref ProdutorFunction
  ConsumidorFunction:
    Value: !Ref ConsumidorFunction
  ConsumidorRole:
    Value: !Ref ConsumidorRole
  AlertasTopic:
    Value: !Ref AlertasTopic
  DeteccoesLogGroup:
    Value: !Ref DeteccoesLogGroup
  ErroAAlarmArn:
    Value: !GetAtt ErroAAlarm.Arn
  E1TemplateId:
    Value: !Ref E1ExperimentTemplate
  E3Erro50TemplateId:
    Value: !Ref E3Erro50Template
  E3Erro100TemplateId:
    Value: !Ref E3Erro100Template
  E3AtrasoTemplateId:
    Value: !Ref E3AtrasoTemplate
  E2TemplateId:
    Value: !Ref E2ExperimentTemplate
